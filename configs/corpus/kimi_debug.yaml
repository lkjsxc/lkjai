target_tokens: 50000
mode: sft
pretrain_ratio: 0.0
sft_ratio: 1.0
output_dir: data/kimi_synthetic
api_provider: kimi-cli
api_base_url: https://api.kimi.com/coding/v1
api_model: kimi-for-coding
user_agent: lkjai-kimi-sft/1.0
kimi_cli_runner: /usr/local/bin/lkjai-native-kimi-cli-runner
kimi_cli_max_steps: 3
pilot_tokens: 1000000
compaction_ratio: 0.25
multi_turn_ratio: 0.60
prompt_dir: tools/kimi-corpus/prompts
prompt_contract: agent-api
fixture_files: [corpus/fixtures/repo-grounding.json]
batch_documents: 8
max_calls: 10
parallelism: 2
timeout_seconds: 180
sleep_between_calls: 1
max_retries: 2
repair_attempts: 1
quarantine_bad_shards: true
stop_file: runs/kimi_corpus/STOP
seed: 42
sft_domains: [direct-finish, read-only-retrieval, mutation-confirmation, failure-safety-recovery]
