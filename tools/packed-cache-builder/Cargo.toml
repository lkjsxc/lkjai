[package]
name = "lkjai_packed_cache_builder"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "lkjai-packed-cache-builder"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokenizers = "0.21"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
