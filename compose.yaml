name: lkjai

services:
  inference:
    profiles: ["inference"]
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.native
      args:
        LKJAI_CUDA_ARCHS: ${LKJAI_CUDA_ARCHS:-}
        LKJAI_GIT_COMMIT: ${LKJAI_GIT_COMMIT:-unknown}
    ports:
      - "127.0.0.1:${MODEL_PORT:-8081}:8081"
    environment:
      INFERENCE_HOST: 0.0.0.0
      INFERENCE_PORT: 8081
      LKJAI_CUDA_ARCHS: ${LKJAI_CUDA_ARCHS:-}
      MODEL_ROOT: /models
      MODEL_NAME: ${MODEL_NAME:-lkjai-scratch-40m}
    volumes:
      - ./data/models:/models
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://127.0.0.1:8081/healthz",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.native
      args:
        LKJAI_CUDA_ARCHS: ${LKJAI_CUDA_ARCHS:-}
        LKJAI_GIT_COMMIT: ${LKJAI_GIT_COMMIT:-unknown}
    command: ["lkjai-native-server"]
    entrypoint: []
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      INFERENCE_HOST: 0.0.0.0
      INFERENCE_PORT: 8080
      DATA_DIR: ${DATA_DIR:-/app/data}
      MODEL_ROOT: /models
      MODEL_NAME: ${MODEL_NAME:-lkjai-scratch-40m}
      AGENT_TOOL_PROFILE: ${AGENT_TOOL_PROFILE:-readonly}
      TOOL_WORKSPACE_DIR: ${TOOL_WORKSPACE_DIR:-/app/data/workspace}
      KJXLKJ_API_URL: ${KJXLKJ_API_URL:-http://host.docker.internal:8080}
      KJXLKJ_USER: ${KJXLKJ_USER:-default}
      KJXLKJ_BEARER_TOKEN: ${KJXLKJ_BEARER_TOKEN:-}
    volumes:
      - ./data/models:/models
      - ./data:/app/data
      - ./docs:/app/data/workspace/docs:ro
      - ./training:/app/data/workspace/training:ro
      - ./corpus:/app/data/workspace/corpus:ro
      - ./configs:/app/data/workspace/configs:ro
      - ./README.md:/app/data/workspace/README.md:ro
      - ./compose.yaml:/app/data/workspace/compose.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  train:
    profiles: ["train"]
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.native
      args:
        LKJAI_CUDA_ARCHS: ${LKJAI_CUDA_ARCHS:-}
        LKJAI_GIT_COMMIT: ${LKJAI_GIT_COMMIT:-unknown}
    environment:
      DATA_DIR: ${TRAIN_DATA_DIR:-/app/data/train}
      LKJAI_CUDA_ARCHS: ${LKJAI_CUDA_ARCHS:-}
      MODEL_NAME: ${MODEL_NAME:-lkjai-scratch-40m}
      TRAIN_PRESET: ${TRAIN_PRESET:-agent}
      TRAIN_CONFIG: ${TRAIN_CONFIG:-/workspace/configs/training/scratch_40m_12h.json}
      TRAIN_NATIVE_CONFIG: ${TRAIN_NATIVE_CONFIG:-/workspace/configs/native/native_40m_bf16.json}
      TRAIN_BEHAVIORAL_CHECKPOINT: ${TRAIN_BEHAVIORAL_CHECKPOINT:-export}
      TRAIN_COMMITTED_CORPUS_DIR: ${TRAIN_COMMITTED_CORPUS_DIR:-/workspace/corpus/generated/kimi-sft-60m}
      TRAIN_CORPUS_DIR: ${TRAIN_CORPUS_DIR:-/app/data/public-corpus}
      TRAIN_PUBLIC_DATA_DIR: ${TRAIN_PUBLIC_DATA_DIR:-/app/data/raw/cosmopedia}
      TRAIN_PUBLIC_PRETRAIN_TOKENS: ${TRAIN_PUBLIC_PRETRAIN_TOKENS:-500000000}
      TRAIN_FIRST_PARTY_SFT_TOKENS: ${TRAIN_FIRST_PARTY_SFT_TOKENS:-60000000}
    entrypoint: ["lkjai-native-train"]
    command: ["--smoke", "--steps", "2"]
    volumes:
      - ./data:/app/data
      - ./corpus:/workspace/corpus:ro
      - ./configs:/workspace/configs:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  corpus:
    profiles: ["corpus"]
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.corpus
      args:
        LKJAI_CUDA_ARCHS: ${LKJAI_CUDA_ARCHS:-}
        LKJAI_GIT_COMMIT: ${LKJAI_GIT_COMMIT:-unknown}
    environment:
      HF_HOME: ${HF_HOME:-/app/data/hf-home}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_TOKEN_FILE: ${HF_TOKEN_FILE:-/run/secrets/hf_token_source}
      HF_HUB_DOWNLOAD_TIMEOUT: ${HF_HUB_DOWNLOAD_TIMEOUT:-60}
      CORPUS_SOURCE_FILE: ${CORPUS_SOURCE_FILE:-/workspace/corpus/sources/public-pretrain.json}
      TRAIN_CORPUS_DIR: ${TRAIN_CORPUS_DIR:-/app/data/public-corpus}
      TRAIN_PUBLIC_DATA_DIR: ${TRAIN_PUBLIC_DATA_DIR:-/app/data/raw/cosmopedia}
      TRAIN_PUBLIC_PRETRAIN_TOKENS: ${TRAIN_PUBLIC_PRETRAIN_TOKENS:-500000000}
      TRAIN_NATIVE_CONFIG: ${TRAIN_NATIVE_CONFIG:-/workspace/configs/native/native_40m_bf16.json}
      TRAIN_TOKENIZER_JSON: ${TRAIN_TOKENIZER_JSON:-/app/data/train/tokenizer/tokenizer.json}
      TRAIN_PACKED_CACHE_DIR: ${TRAIN_PACKED_CACHE_DIR:-/app/data/train/datasets/packed/train-causal_lm_full-seq1024}
      TRAIN_PACKED_CACHE_SEQ_LEN: ${TRAIN_PACKED_CACHE_SEQ_LEN:-1024}
    command: ["validate-public-pretrain"]
    volumes:
      - ./data:/app/data
      - ./corpus:/workspace/corpus:ro
      - ./configs:/workspace/configs:ro
      - ${HF_SECRET_FILE:-/home/lkjsxc/workspace/private/archived/security/secrets/passwords/legacy-passwords.md}:/run/secrets/hf_token_source:ro

  verify:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.verify
      args:
        LKJAI_CUDA_ARCHS: ${LKJAI_CUDA_ARCHS:-}
    working_dir: /workspace
    environment:
      DATA_DIR: /workspace/data/verify
      LKJAI_CUDA_ARCHS: ${LKJAI_CUDA_ARCHS:-}
    volumes:
      - .:/workspace:ro
      - ./data:/workspace/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
